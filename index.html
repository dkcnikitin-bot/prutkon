<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пруткон ОС | Консоль управления</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..700;1,100..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=18.1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="with-hero-bg">
    <div class="app-container">
        <aside id="global-sidebar"></aside>

        <main class="main-content">
            <section id="dashboard" class="view-section active">
                <div id="constructor-main">
                    <!-- UI Blocks injected by core.js:renderConstructor -->
                </div>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>window.DB_VERSION = "18.25.4";</script>
    <script src="bitrix.js?v=18.25.4"></script>
    <script src="header.js?v=18.25.4"></script>
    <script src="menu.js?v=18.25.4"></script>
    <script src="footer.js?v=18.25.4"></script>
    <script src="i18n.js?v=18.25.4"></script>
    <script src="version_history.js?v=18.25.4"></script>
    <script src="core.js?v=18.25.4"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const updateDate = () => {
                const el = document.getElementById('dash-date');
                if (el) {
                    const d = new Date();
                    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    el.innerText = d.toLocaleDateString('ru-RU', options);
                }
            };

            window.updateDashboardData = () => {
                updateDate();
                if(window.formatCurrency) {
                    const ords = window.orders || [];
                    let sum = 0; ords.forEach(o => sum += (parseFloat(o.total) || 0));
                    
                    const rev = document.getElementById('dash-revenue');
                    const cnt = document.getElementById('dash-orders-count');
                    const load = document.getElementById('dash-load-value');
                    if (rev) rev.innerText = window.formatCurrency(sum);
                    if (cnt) cnt.innerText = ords.length;
                    if (load) {
                        const loadPercent = Math.min(100, Math.round((ords.length / 20) * 100));
                        load.innerText = `${loadPercent}%`;
                    }
                    
                    const list = document.getElementById('dash-orders-list');
                    if (list && ords.length > 0) {
                        list.innerHTML = ords.slice(-5).reverse().map(o => `
                            <tr>
                                <td style="padding:15px 25px;">
                                    <div class="text-bold text-white">${o.id || '---'}</div>
                                    <div class="text-xs text-muted">${o.clientName || o.customer || 'Новый клиент'}</div>
                                </td>
                                <td><span class="badge status-info">${o.status || 'В работе'}</span></td>
                                <td class="text-bold emerald text-right" style="padding-right:25px;">${window.formatCurrency(o.total)}</td>
                            </tr>
                        `).join('');
                    } else if (list) {
                        list.innerHTML = `<tr><td colspan="3" class="dash-empty">Нет заказов для отображения</td></tr>`;
                    }
                    
                    const feed = document.getElementById('dash-audit-feed');
                    if (feed && window.dbAuditLog) {
                        const latest = window.dbAuditLog.slice(0, 10);
                        if (!latest.length) {
                            feed.innerHTML = `<div class="dash-empty">Журнал событий пока пуст</div>`;
                            return;
                        }
                        feed.innerHTML = latest.map(l => `
                            <div class="activity-item">
                                <div class="flex justify-between mb-1">
                                    <strong class="text-white">${l.user || 'Система'}</strong>
                                    <span class="text-muted text-xs">${(l.ts || l.time || '').split(',')[1] || ''}</span>
                                </div>
                                <div style="color:var(--brand-red)">${l.action || 'Событие'}</div>
                            </div>
                        `).join('');
                    }
                }
            };

            window.renderConstructor();
            
            window.addEventListener('db_updated', window.updateDashboardData);
            window.addEventListener('ordersSynced', window.updateDashboardData);
            setTimeout(window.updateDashboardData, 800);
        });
    </script>
</body>
</html>
